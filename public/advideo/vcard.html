<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARIA HUB — reels card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* ARIA HUB viral reels card renderer — 1080×1920 stage, captured at 2× DPR.
     Variants: hook | flash | mystery | reveal | show | fomopop | opp |
     ctatext | sitecta | endcard                                        */
  :root {
    --bg-top: #141F3D; --bg-mid: #283868; --bg-bottom: #16223F;
    --accent: #F8D898; --accent-soft: rgba(248,216,152,0.14);
    --accent-line: rgba(248,216,152,0.45);
    --text: #fff; --text-dim: rgba(255,255,255,0.74);
    --deep: #1B2440; --cta-from: #F3D08A; --cta-to: #F8D898; --cta-text: #1B2440;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Vazirmatn', 'Segoe UI', sans-serif; background: #0B1226; color: var(--text);
    position: relative;
  }
  .grad { position: absolute; inset: 0;
    background: linear-gradient(168deg, var(--bg-top) 0%, var(--bg-mid) 46%, var(--bg-bottom) 100%); }
  .dots { position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1.8px, transparent 1.8px); background-size: 42px 42px; }
  .hairline { position: absolute; top: 0; left: 0; width: 100%; height: 8px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 34%, rgba(248,216,152,0.55) 70%, var(--accent-soft) 100%); }
  .logo-chip { border-radius: 30px; overflow: hidden; background: var(--accent);
    outline: 3px solid var(--accent-line); outline-offset: -3px; box-shadow: 0 22px 55px rgba(0,0,0,0.5); flex-shrink: 0; }
  .logo-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 40px; padding: 0 90px; text-align: center; }
  .word { font-weight: 900; line-height: 1.25; text-shadow: 0 14px 60px rgba(0,0,0,0.6); }
  .gold { color: var(--accent); }
  .kicker { display: inline-flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 800;
    letter-spacing: 1px; color: var(--accent); background: var(--accent-soft);
    border: 2.5px solid var(--accent-line); border-radius: 999px; padding: 14px 38px; }

  /* mystery browser mock */
  .browser { position: absolute; left: 90px; right: 90px; top: 300px; height: 1120px;
    border-radius: 34px; overflow: hidden; border: 3px solid rgba(255,255,255,0.14);
    box-shadow: 0 50px 140px rgba(0,0,0,0.7); background: #0E1730; }
  .browser .bar { height: 74px; background: #1A2444; display: flex; align-items: center;
    gap: 16px; padding: 0 28px; }
  .browser .dot { width: 22px; height: 22px; border-radius: 50%; }
  .browser .url { flex: 1; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text-dim);
    letter-spacing: 2px; filter: blur(1.5px); direction: ltr; }
  .browser .shot { position: absolute; top: 74px; left: 0; right: 0; bottom: 0;
    background-size: 100% auto; background-position: center top; }
  .browser .shade { position: absolute; inset: 74px 0 0 0; background: rgba(11,18,38,0.35); }
  .mystery-line { position: absolute; left: 70px; right: 70px; top: 1490px; text-align: center;
    font-size: 74px; font-weight: 800; line-height: 1.4; text-shadow: 0 12px 50px rgba(0,0,0,0.8); }

  /* reveal */
  .reveal-bg { position: absolute; inset: 0; background-size: 100% auto; background-position: center top; }
  .reveal-scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,18,38,0.25) 0%, rgba(11,18,38,0.1) 35%, rgba(11,18,38,0.82) 78%, rgba(11,18,38,0.95) 100%); }
  .reveal-line { position: absolute; left: 60px; right: 60px; bottom: 210px; text-align: center;
    font-size: 92px; font-weight: 900; line-height: 1.35; text-shadow: 0 14px 60px rgba(0,0,0,0.85); }
  .reveal-lock { position: absolute; top: 120px; left: 0; right: 0; display: flex; flex-direction: column;
    align-items: center; gap: 22px; }
  .reveal-lock .logo-chip { width: 170px; height: 170px; }
  .reveal-lock .name { font-size: 56px; font-weight: 800; letter-spacing: 12px; direction: ltr;
    text-shadow: 0 10px 40px rgba(0,0,0,0.8); }

  /* show (rapid sections) */
  .show-bg { position: absolute; inset: 0; background-size: 100% auto; background-position: center top; }
  .show-scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,18,38,0.15) 0%, rgba(11,18,38,0.05) 40%, rgba(11,18,38,0.88) 80%, rgba(11,18,38,0.96) 100%); }
  .show-line { position: absolute; left: 60px; right: 60px; bottom: 250px; text-align: center; }
  .show-line .bar { display: inline-block; background: var(--accent); color: var(--cta-text);
    font-size: 76px; font-weight: 900; padding: 22px 70px; border-radius: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6); }
  .show-lock { position: absolute; top: 90px; right: 70px; display: flex; align-items: center; gap: 18px; }
  .show-lock .logo-chip { width: 84px; height: 84px; border-radius: 22px; }
  .show-lock .name { font-size: 34px; font-weight: 800; letter-spacing: 5px; direction: ltr;
    text-shadow: 0 8px 30px rgba(0,0,0,0.8); }

  /* fomo popping cards */
  .fomo-bg { position: absolute; inset: 0; background-size: 100% auto; background-position: center top;
    filter: brightness(0.42) saturate(0.85); }
  .mini { position: absolute; background: #fff; color: #1B2440; border-radius: 24px;
    box-shadow: 0 26px 70px rgba(0,0,0,0.65); padding: 30px 34px; text-align: right; }
  .mini .org { font-size: 26px; font-weight: 700; color: #5B6B8C; }
  .mini .ttl { font-size: 34px; font-weight: 800; line-height: 1.35; margin-top: 8px; }
  .mini .meta { font-size: 24px; font-weight: 700; color: #0A66C2; margin-top: 12px; }
  .fomo-line { position: absolute; left: 60px; right: 60px; bottom: 170px; text-align: center;
    font-size: 80px; font-weight: 900; line-height: 1.35; text-shadow: 0 12px 55px rgba(0,0,0,0.85); }

  /* featured opportunity */
  .opp-card { position: absolute; left: 80px; right: 80px; top: 480px;
    background: #fff; color: #1B2440; border-radius: 34px; padding: 52px 54px;
    box-shadow: 0 40px 120px rgba(0,0,0,0.7); text-align: right; }
  .opp-card .badge { display: inline-block; background: #E8F4FF; color: #0A66C2;
    font-size: 28px; font-weight: 800; border-radius: 999px; padding: 10px 28px; }
  .opp-card .org { font-size: 32px; font-weight: 700; color: #5B6B8C; margin-top: 26px; }
  .opp-card .ttl { font-size: 52px; font-weight: 900; line-height: 1.3; margin-top: 12px; }
  .opp-card .row { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
  .opp-card .pill { background: #F1F4F9; border-radius: 16px; padding: 14px 26px;
    font-size: 27px; font-weight: 700; color: #33415E; }
  .opp-card .dl { background: #FFF3D6; color: #8A6410; }
  .opp-line { position: absolute; left: 60px; right: 60px; bottom: 150px; text-align: center;
    font-size: 84px; font-weight: 900; line-height: 1.35; text-shadow: 0 12px 55px rgba(0,0,0,0.9); }

  /* site cta */
  .cta-band { position: absolute; left: 70px; right: 70px; bottom: 300px;
    background: linear-gradient(135deg, var(--cta-from) 0%, var(--cta-to) 100%);
    color: var(--cta-text); border-radius: 36px; padding: 46px 54px;
    display: flex; align-items: center; justify-content: space-between; gap: 36px;
    box-shadow: 0 34px 100px rgba(0,0,0,0.6); }
  .cta-band .site { font-size: 62px; font-weight: 900; direction: ltr; text-align: left; }
  .cta-band .sub { font-size: 28px; font-weight: 700; opacity: 0.75; margin-top: 6px; }
  .cta-band img.qr { width: 190px; height: 190px; border-radius: 24px; box-shadow: 0 12px 34px rgba(0,0,0,0.3); }
  .ripple { position: absolute; left: 50%; top: 1050px; width: 260px; height: 260px; margin: -130px;
    border: 6px solid var(--accent); border-radius: 50%; opacity: 0.9;
    box-shadow: 0 0 60px rgba(248,216,152,0.5); }

  /* end card */
  .end-name { font-size: 110px; font-weight: 800; letter-spacing: 22px; direction: ltr; text-indent: 22px; }
  .end-site { font-size: 46px; font-weight: 800; color: var(--accent); direction: ltr; }
  .end-tag { font-size: 36px; font-weight: 600; color: var(--text-dim); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const q = Object.fromEntries(new URLSearchParams(location.search).entries());
  const stage = document.getElementById('stage');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const goldify = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="gold">$1</span>');
  const v = q.v || 'hook';
  const grad = '<div class="grad"></div><div class="dots"></div><div class="hairline"></div>';

  if (v === 'hook') {
    stage.innerHTML = grad + `<div class="center"><div class="word" style="font-size:${esc(q.size || '130')}px;color:${q.gold === '1' ? 'var(--accent)' : '#fff'}">${goldify(q.w)}</div></div>`;
  } else if (v === 'flash') {
    stage.innerHTML = grad + `<div class="center" style="gap:0">
      <div class="word" style="font-size:150px;color:var(--accent);border:6px solid var(--accent-line);border-radius:40px;padding:30px 90px;background:var(--accent-soft)">${goldify(q.w)}</div></div>`;
  } else if (v === 'mystery') {
    stage.innerHTML = grad + `
      <div class="browser">
        <div class="bar">
          <div class="dot" style="background:#FF5F57"></div><div class="dot" style="background:#FEBC2E"></div><div class="dot" style="background:#28C840"></div>
          <div class="url">myariahub${'•'.repeat(6)}com</div>
        </div>
        <div class="shot" style="background-image:url('${esc(q.bg)}');filter:blur(${esc(q.blur || '22')}px)"></div>
        <div class="shade"></div>
      </div>
      <div class="mystery-line">${goldify(q.line)}</div>`;
  } else if (v === 'reveal') {
    stage.innerHTML = `
      <div class="reveal-bg" style="background-image:url('${esc(q.bg)}')"></div>
      <div class="reveal-scrim"></div><div class="hairline"></div>
      <div class="reveal-lock">
        <div class="logo-chip"><img src="/images/logo-mark.png" alt=""/></div>
        <div class="name">ARIA HUB</div>
      </div>
      <div class="reveal-line">${goldify(q.line)}</div>`;
  } else if (v === 'show') {
    stage.innerHTML = `
      <div class="show-bg" style="background-image:url('${esc(q.bg)}')"></div>
      <div class="show-scrim"></div><div class="hairline"></div>
      <div class="show-lock"><div class="logo-chip"><img src="/images/logo-mark.png" alt=""/></div><div class="name">ARIA HUB</div></div>
      <div class="show-line"><span class="bar">${goldify(q.label)}</span></div>`;
  } else if (v === 'fomopop') {
    const cards = [
      { org: 'Action Against Hunger', ttl: 'Logistics Officer — Kabul', meta: 'افغانستان · ددلاین ۱ اکتوبر' },
      { org: 'European Commission', ttl: 'Erasmus+ Joint Master Degrees', meta: 'اروپا · بورسیه کامل' },
      { org: 'UK FCDO', ttl: 'Chevening Scholarships 2026–27', meta: 'بریتانیا · بورسیه کامل' },
    ];
    const pos = [
      { top: 620, right: 90, left: 90 },
      { top: 480, right: 70, left: 250 },
      { top: 880, right: 250, left: 70 },
      { top: 420, right: 80, left: 80 },
    ];
    const n = parseInt(q.n || '1', 10);
    stage.innerHTML = `
      <div class="fomo-bg" style="background-image:url('${esc(q.bg)}')"></div><div class="hairline"></div>
      ${cards.slice(0, n).map((c, i) => `<div class="mini" style="top:${pos[i].top}px;right:${pos[i].right}px;left:${pos[i].left}px">
        <div class="org">${esc(c.org)}</div><div class="ttl">${esc(c.ttl)}</div><div class="meta">${esc(c.meta)}</div>
      </div>`).join('')}
      ${q.line ? `<div class="fomo-line">${goldify(q.line)}</div>` : ''}`;
  } else if (v === 'opp') {
    stage.innerHTML = grad + `
      <div class="opp-card">
        <span class="badge">${esc(q.badge || 'بورسیه')}</span>
        <div class="org">${esc(q.org)}</div>
        <div class="ttl">${esc(q.ttl)}</div>
        <div class="row">
          <span class="pill">${esc(q.country)}</span>
          <span class="pill dl">${esc(q.deadline)}</span>
        </div>
      </div>
      ${q.line ? `<div class="opp-line">${goldify(q.line)}</div>` : ''}`;
  } else if (v === 'ctatext') {
    stage.innerHTML = grad + `<div class="center"><div class="word" style="font-size:${esc(q.size || '120')}px;color:${q.gold === '1' ? 'var(--accent)' : '#fff'}">${goldify(q.w)}</div></div>`;
  } else if (v === 'sitecta') {
    stage.innerHTML = `
      <div class="reveal-bg" style="background-image:url('${esc(q.bg)}')"></div>
      <div class="reveal-scrim"></div><div class="hairline"></div>
      ${q.ripple === '1' ? '<div class="ripple"></div>' : ''}
      <div class="cta-band">
        <div><div class="site">myariahub.com</div><div class="sub">${esc(q.sub || 'کار · بورسیه · ویزا · ابزار شغلی')}</div></div>
        <img class="qr" src="/advideo/qr.png" alt="QR"/>
      </div>`;
  } else if (v === 'endcard') {
    stage.innerHTML = grad + `
      <div class="center" style="gap:44px">
        <div class="logo-chip" style="width:220px;height:220px"><img src="/images/logo-mark.png" alt=""/></div>
        <div class="end-name">ARIA HUB</div>
        <div class="end-site">myariahub.com</div>
        <div class="end-tag">${esc(q.tag || 'همهٔ فرصت‌ها، به زبان شما')}</div>
      </div>`;
  }
  window.__cardReady = true;
</script>
</body>
</html>
