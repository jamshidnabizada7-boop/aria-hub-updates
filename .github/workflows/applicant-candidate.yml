name: Applicant Candidate Verification
on:
  pull_request:

permissions:
  contents: read

jobs:
  applicant-candidate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ariahub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_TEST_DATABASE: '1'
      ARIA_DISABLE_SCHEDULER: '1'
      APPLICANT_AUTH_ENABLED: 'false'
      CLOUD_CV_STORAGE_ENABLED: 'false'
      APPLICANT_CV_SYNC_ENABLED: 'false'
      CV_OCR_ENABLED: 'false'
      APPLICANT_MATCHER_V3_ENABLED: 'false'
      APPLICANT_NOTIFICATIONS_ENABLED: 'false'
      APPLICANT_PUSH_SUBSCRIPTIONS_ENABLED: 'false'
      APPLICANT_PUSH_DELIVERY_ENABLED: 'false'
      APPLICANT_WHATSAPP_VERIFICATION_ENABLED: 'false'
      APPLICANT_WHATSAPP_DELIVERY_ENABLED: 'false'
      APPLICANT_CHANNEL_WORKER_ENABLED: 'false'
      APPLICANT_MATCH_ALERT_WORKER_ENABLED: 'false'
      APPLICANT_MATCH_ALERT_EMAIL_ENABLED: 'false'
      APPLICANT_CAREER_V5_ENABLED: 'false'
      APPLICANT_COPILOT_AI_ENABLED: 'false'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # Candidate-only lockfile remediation. Download and commit the validated
      # lockfile; remove this temporary generator once frozen CI is green.
      - name: Generate security-patched dependency lock proposal
        run: |
          bun audit fix || test "$?" -eq 1
          # Report the remaining unpatched advisory; strict CI still enforces it.
          bun audit --audit-level high || true
          echo ARIA_AUDIT_PATCH_BEGIN
          git diff --no-ext-diff -- bun.lock package.json
          echo ARIA_AUDIT_PATCH_END
      - name: Archive audited package and lockfile proposal
        uses: actions/upload-artifact@v4
        with:
          name: audited-dependencies-${{ github.sha }}
          path: |
            bun.lock
            package.json
          if-no-files-found: error
          retention-days: 2
      - name: Validate Prisma and generate
        run: |
          bunx prisma validate
          bun run db:generate
      - name: Fresh isolated database
        run: |
          bun run db:deploy
          bunx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Applicant and employer regression tests
        run: |
          bun test tests/applicant-milestone-1.test.ts tests/applicant-cv-m2.test.ts tests/applicant-cv-extraction-review.test.ts tests/applicant-matcher-m3.test.ts tests/applicant-saved-search-m3.test.ts tests/applicant-notifications-m4.test.ts tests/applicant-career-m5.test.ts tests/opportunity-matcher.test.ts tests/employer-jobs.test.ts tests/employer-auth.test.ts tests/employer-auth-completion.test.ts tests/apply-resolver.test.ts
      - name: CV isolation, concurrent lifecycle, encrypted sync, and Matcher journey
        run: |
          bun --conditions=react-server test tests/applicant-cv-security-sync-journey.test.ts
          bun --conditions=react-server test tests/applicant-cv-cloud-http.test.ts
      - name: Install isolated CV OCR corpus dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas tesseract-ocr-pus poppler-utils unzip fonts-noto-core fonts-dejavu-core
          python3 -m venv /tmp/aria-cv-corpus-venv
          /tmp/aria-cv-corpus-venv/bin/pip install --quiet --disable-pip-version-check Pillow==11.3.0 python-docx==1.2.0 reportlab==4.4.4
      - name: Validate real-format PDF DOCX and multilingual OCR offline
        timeout-minutes: 9
        run: |
          /tmp/aria-cv-corpus-venv/bin/python scripts/tests/generate-cv-validation-corpus.py --out /tmp/aria-cv-corpus
          bun --conditions=react-server test tests/applicant-cv-real-fixtures.test.ts tests/applicant-cv-real-journey.test.ts
      - name: Verify CV processing worker remains safely disabled
        run: bun --conditions=react-server scripts/applicant-cv-extraction-worker.ts
      - name: Smoke-test notification worker dry-run CLI (zero deliveries)
        run: |
          bun --conditions=react-server scripts/applicant-match-alert-worker.ts
          bun --conditions=react-server scripts/applicant-email-alert-worker.ts
          bun --conditions=react-server scripts/applicant-channel-alert-worker.ts
      - name: Compile standalone website without applicant external services
        run: |
          export ADMIN_SESSION_SECRET="$(openssl rand -hex 32)"
          bun run build
