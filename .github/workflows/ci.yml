name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ariahub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_TEST_DATABASE: '1'
      ARIA_DISABLE_SCHEDULER: '1'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
      ARIA_TRANSLATION_WORKER_URL: postgresql://aria_translation_worker:tgw-test-pw-1234567890@127.0.0.1:5433/ariahub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma schema validation + client generation
        run: |
          bunx prisma validate
          bun run db:generate

      - name: Deploy and verify test database migrations
        run: |
          bun run db:deploy
          bunx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Type check
        run: bunx tsc --noEmit

      - name: Prepare real-format fixture corpus for full repository test suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas tesseract-ocr-pus poppler-utils unzip fonts-noto-core fonts-dejavu-core
          python3 -m venv /tmp/aria-cv-corpus-venv
          /tmp/aria-cv-corpus-venv/bin/pip install --quiet --disable-pip-version-check Pillow==11.3.0 python-docx==1.2.0 reportlab==4.4.4
          /tmp/aria-cv-corpus-venv/bin/python scripts/tests/generate-cv-validation-corpus.py --out /tmp/aria-cv-corpus

      - name: Tests (unit, scraper fixtures, publish safety, security guards*)
        run: |
          # Bun can cache an incompatible module namespace when the AI provider
          # failover suite shares a process with global provider mocks.
          # Preserve every test; run that suite in an independent process.
          mapfile -t test_files < <(find tests -maxdepth 1 -name '*.test.ts' ! -name 'ai-failover.test.ts' ! -name 'applicant-production-auth.test.ts' ! -name 'applicant-services-production.test.ts' -print | sort)
          bun --conditions=react-server test "${test_files[@]}"
          bun --conditions=react-server test tests/ai-failover.test.ts
          # Real account SMTP must not inherit transport mocks from other suites.
          bun --conditions=react-server test tests/applicant-production-auth.test.ts
          bun --conditions=react-server test tests/applicant-services-production.test.ts
        # * The api-guards tests skip automatically: no running server in CI.
        #   Database/publisher tests are required and fail if setup is missing.

      - name: Standalone worker runtime
        run: |
          export CREDENTIALS_SECRET="$(openssl rand -hex 32)"
          bun run worker:social --once

      - name: Production build
        run: |
          export ADMIN_SESSION_SECRET="$(openssl rand -hex 32)"
          bun run build

      - name: Verify editorial poster exports (isolated, no publishing)
        env:
          SOCIAL_RENDER_TOKEN: studio-review-local-test-only
          ADMIN_SESSION_SECRET: studio-review-local-session-test-only-123456789
        run: |
          bunx playwright-core install --with-deps chromium
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/studio-review-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/en > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:3000/en > /dev/null || { cat /tmp/studio-review-server.log; exit 1; }
          bun scripts/tests/studio-editorial-review.ts
          # New 2.0 editorial recipes: actual live PremiumSocialCanvas screenshots.
          bun scripts/tests/studio-brand2-new-preview.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-editorial-review
          path: /tmp/studio-review
          if-no-files-found: ignore

      # Keep the strict unpatched advisory gate red until an upstream fix is
      # published. Other tests must run first so their failures are visible.
      - name: Dependency security audit
        run: bun audit --audit-level high

