name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ariahub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma schema validation + client generation
        run: |
          bunx prisma validate
          bunx prisma generate

      - name: Push schema to test database
        run: bunx prisma db push --skip-generate

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests (unit, scraper fixtures, publish safety, security guards*)
        run: bun test tests/
        # * The api-guards tests skip automatically: no running server in CI.
        #   The publish-safety + utils + fixture tests run against the service
        #   Postgres — a real DB pass in CI on every push.
