name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ariahub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_TEST_DATABASE: '1'
      ARIA_DISABLE_SCHEDULER: '1'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/ariahub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency security audit
        run: bun audit --audit-level high
        continue-on-error: true # TEMPORARY draft-PR validation only; MUST revert before merge

      - name: Prisma schema validation + client generation
        run: |
          bunx prisma validate
          bun run db:generate

      - name: Deploy and verify test database migrations
        run: |
          bun run db:deploy
          bunx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests (unit, scraper fixtures, publish safety, security guards*)
        run: bun test tests/
        # * The api-guards tests skip automatically: no running server in CI.
        #   Database/publisher tests are required and fail if setup is missing.

      - name: Standalone worker runtime
        run: |
          export CREDENTIALS_SECRET="$(openssl rand -hex 32)"
          bun run worker:social --once

      - name: Production build
        run: |
          export ADMIN_SESSION_SECRET="$(openssl rand -hex 32)"
          bun run build
